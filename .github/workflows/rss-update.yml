name: Daily Bandcamp releases
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bandcamp-digest
  cancel-in-progress: false
jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.15.0
      - name: Check followed artists and labels
        run: python -u release_digest.py
      - name: Save feed and baseline
        run: |
          git config user.name 'Bandcamp release digest'
          git config user.email 'actions@users.noreply.github.com'
          git add feed.xml release-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily release digest'
            git push
          fi
