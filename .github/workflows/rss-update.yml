name: Daily Bandcamp releases
on:
  schedule:
    - cron: '17 6,10,12 * * *'
    - cron: '31 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bandcamp-digest
  cancel-in-progress: false
jobs:
  update:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Check whether today already completed
        id: freshness
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          state = json.loads(Path('release-state.json').read_text())
          today = datetime.now(timezone.utc).date().isoformat()
          needed = state.get('last_checked', '')[:10] != today or bool(state.get('failed_catalogues'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'needed={str(needed).lower()}\n')
          print('Scan needed' if needed else 'Today already completed; skipping fallback')
          PYTHON
      - uses: actions/setup-python@v6
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.needed == 'true'
        with:
          python-version: '3.12'
      - if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.needed == 'true'
        run: python -m pip install beautifulsoup4==4.15.0
      - name: Check followed artists and labels
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.needed == 'true'
        run: python -u release_digest.py
      - name: Save feed and baseline
        if: github.event_name == 'workflow_dispatch' || steps.freshness.outputs.needed == 'true'
        run: |
          git config user.name 'Bandcamp release digest'
          git config user.email 'actions@users.noreply.github.com'
          git add feed.xml release-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily release digest'
            git push
          fi
